services:
  # ── Milvus Vector Database ──────────────────────────────
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: multidal-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    networks:
      - multidal-net

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: multidal-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio_data:/minio_data
    networks:
      - multidal-net

  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: multidal-milvus
    depends_on:
      - etcd
      - minio
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "19530:19530"
      - "9091:9091"
    command: ["milvus", "run", "standalone"]
    volumes:
      - milvus_data:/var/lib/milvus
    networks:
      - multidal-net

  # ── MySQL Database ──────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: multidal-mysql
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: multidal
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - multidal-net

  # ── Kafka Message Queue ─────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: multidal-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zk_data:/var/lib/zookeeper/data
    networks:
      - multidal-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: multidal-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/logs
    volumes:
      - kafka_data:/var/lib/kafka
    networks:
      - multidal-net

  # ── FastAPI Server ──────────────────────────────────────
  api:
    build: .
    container_name: multidal-api
    command: uvicorn src.multidal.api.app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - docs_data:/app/docs
      - logs_data:/app/logs
      - session_data:/app/data
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - DB_PATH=data/multidal.db
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=mysql
      - MYSQL_DATABASE=multidal
    depends_on:
      - kafka
      - milvus
      - mysql
    networks:
      - multidal-net

  # ── Worker (Kafka Consumer) ─────────────────────────────
  worker:
    build: .
    container_name: multidal-worker
    command: python -m src.multidal.queue.consumer
    volumes:
      - .:/app
      - docs_data:/app/docs
      - logs_data:/app/logs
      - session_data:/app/data
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - DB_PATH=data/multidal.db
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=mysql
      - MYSQL_DATABASE=multidal
    depends_on:
      - kafka
      - milvus
      - mysql
    networks:
      - multidal-net

  # ── Milvus GUI ───────────────────────────────────────────
  attu:
    image: zilliz/attu:v2.4
    container_name: multidal-attu
    ports:
      - "3000:3000"
    environment:
      MILVUS_URL: milvus:19530
    depends_on:
      - milvus
    networks:
      - multidal-net

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  docs_data:
  logs_data:
  session_data:
  zk_data:
  kafka_data:
  mysql_data:

networks:
  multidal-net:
    driver: bridge

