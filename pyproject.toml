[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multidal"
version = "0.1.0"
description = "Multi-modal RAG system for enterprise document intelligence"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1",
    "transformers>=4.36",
    "pillow>=10.0",
    "magic-pdf>=0.7",
    "pymupdf>=1.23",
    "paddleocr>=2.7",
    "confluent-kafka>=2.3",
    "sqlalchemy>=2.0",
    "pymilvus>=2.3",
    "openai-agents>=0.0.6",
    "fastapi>=0.108",
    "uvicorn[standard]>=0.25",
    "pyyaml>=6.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ragas>=0.1",
]

[tool.setuptools.packages.find]
where = ["src"]
